name: Update portfolio snapshot

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_snapshot.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/portfolio-snapshot.json
          git diff --cached --quiet || git commit -m "chore(data): refresh portfolio snapshot"
          # Snapshot updates are committed on the default branch by this
          # scheduled job; branch protection should require the normal review
          # policy before enabling this workflow in production.
          git push origin HEAD:${{ github.event.repository.default_branch }}
